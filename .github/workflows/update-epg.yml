name: Update EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EPG
        run: python build_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name "EPG Bot"
          git config user.email "actions@github.com"
          git add guide.xml
          git diff --cached --quiet || git commit -m "Update EPG"
          git push
