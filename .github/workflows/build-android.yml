name: Build Umay TV Guide APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Require stable Android signing key
        env:
          UMAY_DEBUG_KEYSTORE_BASE64: ${{ secrets.UMAY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UMAY_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: UMAY_DEBUG_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

      - name: Restore stable Android signing key
        env:
          UMAY_DEBUG_KEYSTORE_BASE64: ${{ secrets.UMAY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"

          echo "$UMAY_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "ERROR: Restored keystore is empty"
            exit 1
          fi

      - name: Show signing certificate fingerprint
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep -E 'SHA256:|Alias name:|Valid from:|Owner:'

      - name: Verify expected permanent certificate
        run: |
          CERT_SHA256=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep "SHA256:" \
            | sed 's/.*SHA256: //' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          EXPECTED_SHA256="8638752900fc85d518b99fdb236f535131060fc3407b9471373f0a88a777c943"

          echo "Keystore SHA256: $CERT_SHA256"

          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: Wrong signing keystore"
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $CERT_SHA256"
            exit 1
          fi

      - name: Compile Kotlin with full errors
        working-directory: android
        run: |
          gradle :app:compileDebugKotlin \
            --info \
            --console=plain \
            --no-build-cache

      - name: Clean project
        working-directory: android
        run: |
          gradle clean \
            --console=plain

      - name: Build signed debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --no-build-cache \
            --stacktrace \
            --console=plain

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -1)

          echo "Using apksigner: $APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Confirm APK uses permanent signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -1)

          APK_SHA256=$("$APKSIGNER" verify \
            --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep "certificate SHA-256 digest:" \
            | head -1 \
            | sed 's/.*digest: //' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          EXPECTED_SHA256="8638752900fc85d518b99fdb236f535131060fc3407b9471373f0a88a777c943"

          echo "APK certificate SHA256: $APK_SHA256"

          if [ "$APK_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK was signed with the wrong certificate"
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $APK_SHA256"
            exit 1
          fi

          echo "APK signing certificate is correct."

      - name: Prepare release APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            Umay-TV-Guide.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umay-TV-Guide-APK
          path: Umay-TV-Guide.apk
          if-no-files-found: error

      - name: Remove previous latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            Umay-TV-Guide.apk \
            --repo "${{ github.repository }}" \
            --title "Umay TV Guide - Latest" \
            --notes "Automatically built from commit ${{ github.sha }}." \
            --latest
