name: Build Umay TV Guide APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Kotlin with full errors
        working-directory: android
        run: gradle :app:compileDebugKotlin --info --console=plain

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Prepare release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             Umay-TV-Guide.apk

      # Keep an Actions artifact too, useful if something goes wrong
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umay-TV-Guide-APK
          path: Umay-TV-Guide.apk
          if-no-files-found: error

      # Remove the previous rolling "latest" release/tag
      - name: Remove previous latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      # Create a fresh rolling release and attach the APK
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            Umay-TV-Guide.apk \
            --repo "${{ github.repository }}" \
            --title "Umay TV Guide - Latest" \
            --notes "Automatically built from commit ${{ github.sha }}." \
            --latest
